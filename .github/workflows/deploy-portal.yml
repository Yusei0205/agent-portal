# Deploy the cloud portal (AgentPortalCloud: API Lambda, web files, tables, CloudFront) to AWS.
#
#   verify  - on pull requests that touch the portal: type check and the production build (no AWS access). On a push to
#             main_v3 CI (ci.yml) already does both, so this job does not run there.
#   deploy  - on pushes to main_v3 only, or by hand on main_v3. It installs and builds the web files first, then waits for CI
#             on this commit (scripts/wait-for-ci.mjs) and deploys only when it passed, so the build and CI run side by side.
#             It runs on a native arm64 runner: the portal function, the job runtime and the Codex runner are all arm64 images,
#             and building them on an x86 runner meant emulating the whole build.
#
# What it deploys, in this order (scripts/deploy-scope.mjs decides from the files the push changed):
#   1. When the push changed the Claude/Kiro runner images, it waits for the deploy-agentcore.yml run on the same commit, so the
#      portal never goes live before runners that understand what it sends.
#   2. The Codex runner, only when a file that goes into its image changed (otherwise the running one is kept and linked).
#   3. AgentPortalCloud, with the same context values as manual deploys, including the long-job runtime.
#
# When CI fails on a flaky test, re-run CI's failed jobs, and once they pass, re-run this workflow's
# failed jobs: the CI check then sees the passing run and the deploy goes ahead.
#
# AWS access is the same as deploy-agentcore.yml: GitHub OIDC into agent-portal-github-deploy, which
# trusts only jobs of this repository in the "aws-prod" environment, so give that environment required
# reviewers and limit it to main_v3 (Settings > Environments) and every deploy waits for an approval.
#
# The context values below are the account's current ones. Override any of them with a repository
# variable of the same name (Settings > Variables) when the runtimes or bucket change; a value dropped
# from `cdk deploy` removes the matching setting or resource, so keep the set complete (jobRuntime and jobRuntimeAgentRuns included).
name: Deploy portal

on:
  push:
    branches: [main_v3]
    paths:
      - server/**
      - codex-runner/**
      - web/**
      - scripts/**
      - '!scripts/test-*.mjs'
      - infra/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-portal.yml
  pull_request:
    paths:
      - server/**
      - codex-runner/**
      - web/**
      - infra/**
      - .github/workflows/deploy-portal.yml
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits for the running one instead of cancelling it half way.
concurrency:
  group: deploy-portal-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Type check and build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix agent-runner --no-audit --no-fund
          npm ci --prefix kiro-runner --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build the web files
        run: npm run build:web

      - name: Type-check the infrastructure
        run: |
          cd infra
          npm ci --no-audit --no-fund
          npx tsc --noEmit

  deploy:
    name: Deploy to AWS (ap-southeast-1)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main_v3'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    environment: aws-prod
    permissions:
      contents: read
      actions: read # list CI's and the runner deploy's runs on this commit
      id-token: write # GitHub OIDC → AWS
    env:
      BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL || 'yuseitan@gmail.com' }}
      KIRO_RUNTIME_ARN: ${{ vars.KIRO_RUNTIME_ARN || 'arn:aws:bedrock-agentcore:ap-southeast-1:366019841051:runtime/agentPortalKiroHarness-cb9yhJCYyX' }}
      CLAUDE_RUNTIME_ARN: ${{ vars.CLAUDE_RUNTIME_ARN || 'arn:aws:bedrock-agentcore:ap-southeast-1:366019841051:runtime/agentPortalClaudeHarness-BW7D1pFqIl' }}
      STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET || 'cy-ai-bucket' }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://d1tah6dqw2fe9f.cloudfront.net' }}
      CODEX_AUTH_MODE: ${{ vars.CODEX_AUTH_MODE || 'oauth' }}
      CODEX_OAUTH_CLIENT_ID: ${{ vars.CODEX_OAUTH_CLIENT_ID }}
      CODEX_OAUTH_CLIENT_SECRET_ARN: ${{ vars.CODEX_OAUTH_CLIENT_SECRET_ARN }}
      # The long-job runtime and the runs that use it. Dropping these from `cdk deploy` deletes the runtime (and every deploy
      # that left them out did exactly that), so they are on by default; a repository variable turns them off on purpose.
      JOB_RUNTIME: ${{ vars.JOB_RUNTIME || 'true' }}
      JOB_RUNTIME_AGENT_RUNS: ${{ vars.JOB_RUNTIME_AGENT_RUNS || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the diff against the commit before the push (scripts/deploy-scope.mjs)

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix infra --no-audit --no-fund

      - name: Build the web files
        # The stack uploads dist/web and does not build it.
        run: npm run build:web

      - name: Which images changed
        id: scope
        run: node scripts/deploy-scope.mjs
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}

      - name: Wait for CI on this commit
        # CI runs while the web files above are built; nothing is deployed until it has passed.
        run: node scripts/wait-for-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Wait for the runner deploy on this commit
        # The runner images this commit changed are live before the portal that depends on them.
        if: github.event_name == 'push' && steps.scope.outputs.runners == 'true'
        run: node scripts/wait-for-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CI_WORKFLOW: deploy-agentcore.yml
          CI_WAIT_MINUTES: '60'

      - name: Sign in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::366019841051:role/agent-portal-github-deploy' }}
          role-session-name: agent-portal-portal-${{ github.run_id }}
          aws-region: ap-southeast-1

      - name: Deploy Codex AgentCore runner
        # Only when a file that goes into its image changed. Its image is built here, natively (this runner is arm64).
        if: steps.scope.outputs.codex == 'true'
        working-directory: infra
        run: >-
          npx aws-cdk@2.1147.0 deploy AgentPortalCodexRunner
          -c codexRunner=1
          -c "publicUrl=$PUBLIC_URL"
          --require-approval never
          --outputs-file "$RUNNER_TEMP/codex-runner-outputs.json"

      - name: Find the Codex AgentCore runtime
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/codex-runner-outputs.json" ]]; then
            arn=$(node -e "const o=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(o.AgentPortalCodexRunner?.CodexRuntimeArn||'')" "$RUNNER_TEMP/codex-runner-outputs.json")
          else
            echo "The Codex runner image is unchanged: keeping the running one."
            arn=$(aws cloudformation describe-stacks --stack-name AgentPortalCodexRunner --query "Stacks[0].Outputs[?OutputKey=='CodexRuntimeArn'].OutputValue" --output text)
          fi
          if [[ -z "$arn" || "$arn" == "None" ]]; then echo "No Codex runtime ARN found" >&2; exit 1; fi
          callback="${PUBLIC_URL%/}/api/codex/oauth/callback"
          echo "CODEX_RUNTIME_ARN=$arn" >> "$GITHUB_ENV"
          echo "CODEX_OAUTH_REDIRECT_URI=$callback" >> "$GITHUB_ENV"

      - name: Deploy AgentPortalCloud
        working-directory: infra
        shell: bash
        run: |
          args=(
            deploy AgentPortalCloud --require-approval never
            -c "budgetEmail=$BUDGET_EMAIL"
            -c "kiroRuntimeArn=$KIRO_RUNTIME_ARN"
            -c "claudeRuntimeArn=$CLAUDE_RUNTIME_ARN"
            -c "storageBucket=$STORAGE_BUCKET"
            -c agentcoreBrowser=true
            -c "publicUrl=$PUBLIC_URL"
            -c "codexRuntimeArn=$CODEX_RUNTIME_ARN"
            -c "codexAuthMode=$CODEX_AUTH_MODE"
            -c "codexOAuthClientId=$CODEX_OAUTH_CLIENT_ID"
            -c "codexOAuthRedirectUri=$CODEX_OAUTH_REDIRECT_URI"
            -c "jobRuntime=$JOB_RUNTIME"
            -c "jobRuntimeAgentRuns=$JOB_RUNTIME_AGENT_RUNS"
          )
          if [[ -n "$CODEX_OAUTH_CLIENT_SECRET_ARN" ]]; then
            args+=(-c "codexOAuthSecretArn=$CODEX_OAUTH_CLIENT_SECRET_ARN")
          fi
          npx aws-cdk@2.1147.0 "${args[@]}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Portal deploy"
            echo "Commit \`${GITHUB_SHA::7}\` → AgentPortalCloud, ${PUBLIC_URL}"
            echo "Runner images changed: ${{ steps.scope.outputs.runners || 'not checked' }}; Codex runner deployed: ${{ steps.scope.outputs.codex || 'not checked' }}."
          } >> "$GITHUB_STEP_SUMMARY"
